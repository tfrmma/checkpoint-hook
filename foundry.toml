[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = true
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/uniswap-hooks/lib/v4-periphery/",
  "@openzeppelin/contracts/=lib/uniswap-hooks/lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/uniswap-hooks/lib/v4-core/src/",
  "v4-periphery/=lib/uniswap-hooks/lib/v4-periphery/src/",
  "uniswap-hooks/=lib/uniswap-hooks/",
]

[fuzz]
runs = 1000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
